
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبرد نخبگان</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101c30;color:white;font-family:tahoma;text-align:center}
header{background:#172b46;padding:15px}
h1{color:#ffd36b;margin:5px}
.stats{display:flex;justify-content:space-around;gap:5px;padding:12px;flex-wrap:wrap}
.stats span{background:#243c59;padding:10px;border-radius:10px}
.arena{margin:12px;background:#315e43;border:5px solid #b78b4d;border-radius:15px;padding:12px}
.towers{display:flex;justify-content:space-around;margin:12px}
.tower{background:#b68b55;padding:15px 8px;border-radius:10px;width:29%;color:#211608}
.hp{height:9px;background:#777;border-radius:8px;overflow:hidden;margin-top:8px}
.hp div{height:100%;background:#37df73;width:100%}
.bridge{background:#a87943;padding:12px;margin:12px;border-radius:8px}
#units{min-height:85px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.unit{font-size:25px;animation:move 1s infinite alternate}
@keyframes move{to{transform:translateY(-5px)}}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}
.card{background:#263d5a;border:2px solid #d4aa50;border-radius:10px;padding:10px;color:white}
.card:disabled{opacity:.4}
button{cursor:pointer}
.action{background:#d7a744;color:#241b0b;padding:12px;border:0;border-radius:10px;font-weight:bold}
#log{min-height:30px;color:#ffe28a;padding:8px}
</style>
</head>
<body>
<header>
<h1>⚔️ نبرد نخبگان ⚔️</h1>
<div>امپراتوری خودت را بساز!</div>
</header>

<div class="stats">
<span>👑 سطح: <b id="level">1</b></span>
<span>🏆 کاپ: <b id="cups">0</b></span>
<span>🪙 سکه: <b id="coins">500</b></span>
<span>⭐ XP: <b id="xp">0</b></span>
</div>

<div class="arena">
<h3>🏰 میدان نبرد</h3>
<div class="towers">
<div class="tower">🏰 برج دشمن<div class="hp"><div id="enemyhp"></div></div></div>
<div class="tower">👑 برج اصلی<div class="hp"><div id="mainhp"></div></div></div>
<div class="tower">🏰 برج دشمن<div class="hp"><div id="enemyhp2"></div></div></div>
</div>
<div class="bridge">🌉 مسیر اول　 |　 🌉 مسیر دوم</div>
<div id="units"></div>
<div id="log">برای شروع، سرباز انتخاب کن!</div>
</div>

<div>💧 اکسیر: <b id="elixir">5</b> / 10</div>
<div class="hp"><div id="energy" style="width:50%"></div></div>

<h3>🃏 کارت‌های سرباز</h3>
<div class="cards" id="cards"></div>
<button class="action" onclick="startBattle()">⚔️ شروع نبرد جدید</button>

<script>
const names=[
"شمشیرزن","کماندار","نیزه‌دار","تبرزن","سپر‌دار",
"سواره‌نظام","فیل جنگی","فیل‌سوار","کماندار سنگین","شمشیرزن طلایی",
"نگهبان","فرمانده","جاسوس","کماندار آتشین","نیزه‌دار سلطنتی",
"غول جنگی","جنگجوی کوهستان","تیرانداز","سرباز زرهی","دژکوب",
"شوالیه","سوارکار سریع","کماندار سلطنتی","تبرزن سنگین","محافظ شاه",
"جنگجوی صحرا","جنگجوی یخی","جنگجوی آتشین","غول سنگی","غول آهنی",
"شمشیرزن افسانه‌ای","شاهزاده","سردار بزرگ","فیل سلطنتی","کماندار افسانه‌ای",
"نیزه‌دار افسانه‌ای","محافظ طلایی","شکارچی","جنگجوی شب","جنگجوی اژدها",
"اژدها","اژدهای آتشین","جادوگر","جادوگر یخی","جادوگر آتش",
"شبح جنگی","هیولای سنگی","تایتان","امپراتور","فرمانده افسانه‌ای",
"نگهبان اژدها","شوالیه سیاه","شوالیه طلایی","ققنوس","غول آتشین",
"اژدهای سلطنتی","پادشاه جنگ","قهرمان باستانی","خدای جنگ","اسطوره"
];
const icons=["⚔️","🏹","🔱","🪓","🛡️","🐎","🐘","🐘","🎯","🗡️","💂","👑","🥷","🔥","🔱","🗿","⛰️","🏹","🪖","🏰","🤺","🐴","🏹","🪓","👑","⚔️","❄️","🔥","🗿","🤖","🗡️","🤴","🎖️","🐘","🏹","🔱","🛡️","🦅","🌑","🐉","🐲","🐉","🧙","❄️","🔥","👻","🗿","🦾","👑","🌟","🐲","⚫","🟡","🔥","🌋","🐉","👑","⚡","⚔️","🏆"];
let level=1,xp=0,cups=0,coins=500,elixir=5;
let enemyHP=100,playerHP=100,busy=false;
let owned=[0,1,2,3,4,5,6,7];
let selected=0;
function update(){
document.getElementById("level").textContent=level;
document.getElementById("xp").textContent=xp;
document.getElementById("cups").textContent=cups;
document.getElementById("coins").textContent=coins;
document.getElementById("elixir").textContent=elixir;
document.getElementById("enemyhp").style.width=enemyHP+"%";
document.getElementById("enemyhp2").style.width=enemyHP+"%";
document.getElementById("mainhp").style.width=playerHP+"%";
document.getElementById("energy").style.width=elixir*10+"%";
}
function render(){
let c=document.getElementById("cards");c.innerHTML="";
owned.forEach(i=>{
let b=document.createElement("button");
b.className="card";
b.innerHTML=icons[i]+"<br>"+names[i]+"<br>💧"+(3+i%5);
b.onclick=()=>deploy(i);c.appendChild(b);
});
}
function gainXP(n){
xp+=n;
while(xp>=level*100&&level<60){
xp-=level*100;level++;
coins+=100;
document.getElementById("log").textContent="🎉 سطح جدید! سطح "+level;
}
update();
}
function deploy(i){
let cost=3+i%5;
if(busy){return;}
if(elixir<cost){
document.getElementById("log").textContent="اکسیر کافی نیست!";
return;
}
elixir-=cost;
let u=document.createElement("span");
u.className="unit";
u.textContent=icons[i];
document.getElementById("units").appendChild(u);
document.getElementById("log").textContent=names[i]+" وارد میدان شد!";
update();
setTimeout(()=>{
if(!busy)return;
let damage=8+(i%10)*2;
enemyHP=Math.max(0,enemyHP-damage);
u.remove();
if(enemyHP===0)win();
update();
},1800);
}
function startBattle(){
busy=true;enemyHP=100;playerHP=100;elixir=5;
document.getElementById("units").innerHTML="";
document.getElementById("log").textContent="⚔️ نبرد آغاز شد!";
update();
let t=setInterval(()=>{
if(!busy){clearInterval(t);return;}
elixir=Math.min(10,elixir+1);
if(Math.random()<.35){
playerHP=Math.max(0,playerHP-8);
if(playerHP===0){
busy=false;cups=Math.max(0,cups-10);
document.getElementById("log").textContent="💀 شکست خوردی!";
clearInterval(t);
}
}
update();
},3000);
}
function win(){
busy=false;cups+=30;coins+=150;gainXP(50);
document.getElementById("log").textContent="🏆 پیروزی! +۳۰ کاپ و ۱۵۰ سکه";
update();
}
render();update();
</script>
</body>
</html>
