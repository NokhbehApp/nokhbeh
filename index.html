
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نخبه | آموزش هوشمند</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,sans-serif;
 background:#071b38;
 color:#e7ffff;
 padding:20px;
}
header{text-align:center;padding:25px 10px}
.logo{
 width:75px;height:75px;margin:auto;
 display:grid;place-items:center;
 border-radius:22px;
 background:#102d50;
 color:#ffd166;
 font-size:38px;
 border:2px solid #ffd166;
}
h1{color:#38e0d0;margin-bottom:8px}
p{color:#b8d8e7;line-height:2}
h2{color:#38e0d0;font-size:19px}
.card{
 background:#102b4b;
 border:1px solid #24496b;
 border-radius:16px;
 padding:18px;margin:13px 0;
}
button{
 width:100%;padding:15px;margin:7px 0;
 border:1px solid #2c637b;
 border-radius:12px;
 background:#123b5c;
 color:#42e5d6;
 font-size:16px;
 font-weight:bold;
}
button:active{background:#205d70}
.gold{color:#ffd166}
input{
 width:100%;padding:13px;
 border-radius:10px;border:0;
 margin:8px 0;font-size:15px;
}
.hidden{display:none}
footer{text-align:center;color:#91aebd;margin-top:30px}
</style>
</head>
<body>
<header>
 <div class="logo">★</div>
 <h1>نخبه</h1>
 <p>هوشمندانه یاد بگیر، درخشان بدرخش!</p>
</header>

<main id="home">
 <div class="card">
  <h2>🎓 انتخاب پایه تحصیلی</h2>
  <button onclick="grade(7)">پایه هفتم</button>
  <button onclick="grade(8)">پایه هشتم</button>
  <button onclick="grade(9)">پایه نهم</button>
 </div>
 <div class="card">
  <h2>✨ امکانات نخبه</h2>
  <p>📚 آموزش درس‌ها</p>
  <p>📝 آزمون و نمونه سؤالات</p>
  <p>🏆 رقابت و رتبه‌بندی</p>
  <p>📖 جزوه و خلاصه درس‌ها</p>
 </div>
</main>

<section id="lessons" class="hidden">
 <div class="card">
  <h2 id="gradeTitle"></h2>
  <p>درس مورد نظرت را انتخاب کن:</p>
  <div id="subjects"></div>
  <button onclick="back()">⬅ بازگشت</button>
 </div>
</section>

<section id="study" class="hidden">
 <div class="card">
  <h2 id="subjectTitle"></h2>
  <p id="studyText">به بخش آموزش خوش آمدی.</p>
  <button onclick="alert('محتوای آموزشی این درس به زودی اضافه می‌شود.')">📚 مشاهده آموزش</button>
  <button onclick="alert('آزمون این درس به زودی اضافه می‌شود.')">📝 آزمون درس</button>
  <button onclick="backToLessons()">⬅ بازگشت به درس‌ها</button>
 </div>
</section>

<footer>نخبه | آینده از آن توست ⭐</footer>

<script>
let currentGrade=7;
const data={
7:["ریاضی","علوم","فارسی","عربی","انگلیسی","مطالعات اجتماعی","پیام‌های آسمان","قرآن","کار و فناوری"],
8:["ریاضی","علوم","فارسی","عربی","انگلیسی","مطالعات اجتماعی","پیام‌های آسمان","قرآن","کار و فناوری"],
9:["ریاضی","علوم","فارسی","عربی","انگلیسی","مطالعات اجتماعی","پیام‌های آسمان","قرآن","کار و فناوری"]
};
function grade(n){
 currentGrade=n;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("study").classList.add("hidden");
 document.getElementById("lessons").classList.remove("hidden");
 document.getElementById("gradeTitle").innerText="پایه "+n+" | انتخاب درس";
 document.getElementById("subjects").innerHTML="";
 data[n].forEach(s=>{
 let b=document.createElement("button");
 b.innerText="📘 "+s;
 b.onclick=()=>openSubject(s);
 document.getElementById("subjects").appendChild(b);
 });
}
function openSubject(s){
 document.getElementById("lessons").classList.add("hidden");
 document.getElementById("study").classList.remove("hidden");
 document.getElementById("subjectTitle").innerText=s+" | پایه "+currentGrade;
 document.getElementById("studyText").innerText="بخش آموزشی "+s+" انتخاب شد. محتوای درس باید به برنامه اضافه شود.";
}
function back(){
 document.getElementById("lessons").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}
function backToLessons(){grade(currentGrade)}
</script>
</body>
</html>
